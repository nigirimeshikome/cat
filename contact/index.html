            </ul>

        <main>
            <div class="title-wrap">
                <h1 class="title">お問い合わせ</h1>
            </div>
            <section id="contact">
                <h2>お問い合わせフォーム</h2>
                <form action=""><!-- method属性付けましょう -->
                    <p><label for="">お問い合わせ種別</label></p>
                    <select name="" id="">
                        <option value="">譲渡会参加申し込み</option>
                        <option value="">預かりボランティア応募</option>
                        <option value="">その他お問い合わせ</option>
                    </select>
                    <p><label for="">お名前（漢字）</label></p>
                    <input type="text" name="" placeholder="姓" required>
                    <input type="text" name="" placeholder="名" required>
                    <p><label for="">お名前（フリガナ）</label></p>
                    <input type="text" name="" placeholder="セイ" required>
                    <input type="text" name="" placeholder="メイ" required>
                    <p><label for="">メールアドレス</label></p>
                    <input type="email" name="email" required class="width">
                    <p><label for="">電話番号</label></p>
                    <input type="tel" name="tel" required class="width">
                    <p><label for="">メッセージ</label></p>
                    <textarea name="message" required></textarea>
                    <p><input type="submit" value="送信する" id="submit-btn"></p>
                </form>
            </section>
        </main>
    </div>
    <footer>
        <small>
            <p>四つ葉ねこ All Rights Reserved</p>
